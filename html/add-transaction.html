<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker - Add Transaction</title>

    <link rel="stylesheet" href="../css/add-transaction.css">
</head>

<body>

    <div class="app-container">

        <!-- ================= SIDEBAR ================= -->

        <aside class="sidebar">

            <div class="logo">
                <span>Expense</span>
                <span>Tracker</span>
            </div>

            <nav class="sidebar-nav">

                <a href="index.html" class="nav-item">
                    <span class="nav-icon">⌂</span>
                    <span>Dashboard</span>
                </a>

                <a href="add-transaction.html" class="nav-item active">
                    <span class="nav-icon">⊕</span>
                    <span>Add Transaction</span>
                </a>

                <a href="transactions.html" class="nav-item">
                    <span class="nav-icon">▣</span>
                    <span>Transactions</span>
                </a>

                <a href="reports.html" class="nav-item">
                    <span class="nav-icon">▧</span>
                    <span>Reports</span>
                </a>

                <a href="settings.html" class="nav-item">
                    <span class="nav-icon">⚙</span>
                    <span>Settings</span>
                </a>

            </nav>

            <a href="#" class="logout">
                <span class="logout-icon">↪</span>
                <span>Logout</span>
            </a>

        </aside>


        <!-- ================= MAIN CONTENT ================= -->

        <main class="main-content">

            <section class="transaction-form-card">

                <h1>Add New Transaction</h1>


                <!-- Transaction Form -->

                <form class="transaction-form">


                    <!-- TYPE -->

                    <div class="form-group">

                        <!-- <label>Type</label> -->

                        <div class="type-buttons">

                            <button type="button" class="type-btn income-btn active-type">
                                Income
                            </button>

                            <button type="button" class="type-btn expense-btn">
                                Expense
                            </button>

                        </div>

                    </div>


                    <!-- AMOUNT -->

                    <div class="form-group">

                        <label for="amount">
                            Amount (₹)
                        </label>

                        <input type="number" id="amount" placeholder="Enter amount" min="0">

                    </div>


                    <!-- CATEGORY -->

                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <div class="select-wrapper">

                            <select id="category">

                                <option value="">
                                    Select category
                                </option>

                                <option value="salary">
                                    Salary
                                </option>

                                <option value="freelance">
                                    Freelance
                                </option>

                                <option value="food">
                                    Food
                                </option>

                                <option value="transport">
                                    Transport
                                </option>

                                <option value="shopping">
                                    Shopping
                                </option>

                                <option value="bills">
                                    Bills
                                </option>

                                <option value="education">
                                    Education
                                </option>

                                <option value="other">
                                    Other
                                </option>

                            </select>

                        </div>

                    </div>


                    <!-- DESCRIPTION -->

                    <div class="form-group">

                        <label for="description">
                            Description
                        </label>

                        <textarea id="description" placeholder="Enter description" rows="3"></textarea>

                    </div>


                    <!-- DATE -->

                    <div class="form-group">

                        <label for="date">
                            Date
                        </label>

                        <input type="date" id="date" value="2026-08-25">

                    </div>


                    <!-- SUBMIT BUTTON -->

                    <button type="submit" class="add-btn">

                        <span>Add Transaction</span>

                        <span class="plus-icon">+</span>

                    </button>

                </form>

            </section>

        </main>

    </div>

</body>

</html>
